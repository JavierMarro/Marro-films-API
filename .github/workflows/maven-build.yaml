name: Maven Build on Push

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**/*'
jobs:
  build_and_verify:
          name: Run Merge Checks
          runs-on: ubuntu-latest
          permissions:
              checks: write
              pull-requests: write
          steps:
              - name: Check out the repo
                uses: actions/checkout@v5

              - name: Setup Java 21
                uses: actions/setup-java@v4
                with:
                    java-version: '21'
                    distribution: 'temurin'
                    architecture: x64
                    cache: 'maven'

              - name: Build with Maven
                run: ./mvnw -B clean verify --no-transfer-progress

              - name: Publish Test Results
                uses: EnricoMi/publish-unit-test-result-action/linux@v2
                if: always()
                with:
                    files:  |
                      ./target/surefire-reports/TEST-*.xml

              - name: Upload JAR Artifact
                uses: actions/upload-artifact@v4
                with:
                  name: spring-boot-app
                  path: target/*.jar

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build_and_verify # Only run if the build + verify succeeds

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Build Docker Image
        run: docker build -t marro-films-api:${{ github.sha }} .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner.toLower() }}/marro-films-api:${{ github.sha }}
          docker tag marro-films-api:${{ github.sha }} $IMAGE
          docker push $IMAGE